[project]
name = "ai-assessment"
version = "0.1.0"
description = "AI-powered student assessment system — GenAI learning project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",
    "jinja2>=3.1.6",
    "markdown>=3.10.2",
    "pygments>=2.19.2",
]

[project.optional-dependencies]
rag = [
    "langchain-openai>=0.2.0",
    "langchain-chroma>=0.2.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",
    "unstructured>=0.15.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]
agents = [
    "langgraph>=0.2.0",
]
eval = [
    "langfuse>=2.0.0",
    "ragas>=0.2.0",
    "langsmith>=0.1.0",
]
all = [
    "ai-assessment[rag,agents,eval]",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "RUF",
]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.15.7",
]
