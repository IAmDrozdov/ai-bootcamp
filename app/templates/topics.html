{% extends "base.html" %}

{% block title %}Уроки — AI Bootcamp{% endblock %}

{% block content %}
<h1>Уроки</h1>
<div class="topics-grid">
    {% for topic in topics %}
    <a href="/lessons/{{ topic.slug }}" class="topic-card">
        <span class="topic-number">{{ "%02d"|format(topic.number) }}</span>
        <span class="topic-title">{{ topic.title }}</span>
    </a>
    {% endfor %}
</div>
{% endblock %}
